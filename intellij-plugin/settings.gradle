plugins {
    // Lets Gradle auto-download a matching JDK when the required toolchain (JDK 25
    // for IntelliJ 2026.2) isn't found among the locally-detected installations.
    // Used only as a fallback — see `org.gradle.java.installations.paths` in
    // gradle.properties, which points at the IDE's bundled JBR 25 (no download).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'rosegold-intellij'
