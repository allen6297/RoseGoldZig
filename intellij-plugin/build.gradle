plugins {
    id 'java'
    // IntelliJ Platform Gradle Plugin 2.x — rewritten for modern Gradle (8.5+,
    // incl. Gradle 9). The classic 1.x plugin does NOT work on Gradle 9.
    id 'org.jetbrains.intellij.platform' version '2.6.0'
}

group = 'org.rosegold'
version = '0.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // The target IDE to build/run against. IC = IDEA Community.
        intellijIdeaCommunity '2023.3.8'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '233'
            untilBuild = '243.*'
        }
    }
}
