plugins {
    id 'java'
    // Kotlin is used for the inlay-hints provider (the declarative inlay API is
    // absent from this platform's classpath, and the legacy one is Kotlin-shaped).
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    // IntelliJ Platform Gradle Plugin 2.x — rewritten for modern Gradle (8.5+,
    // incl. Gradle 9). The classic 1.x plugin does NOT work on Gradle 9. Keep this
    // recent enough to resolve the target platform (older 2.x can't see 2026.x).
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'org.rosegold'
version = '0.2.1'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // The target IDE to build/run against. Since 2025.3 the Community and
        // Ultimate distributions were unified into a single `intellijIdea(...)`
        // artifact. Downloading a full release assembles the complete platform
        // classpath; override the version with -PplatformVersion=… to match your
        // IDE. Keep this in step with `sinceBuild` below.
        def platformVersion = project.findProperty('platformVersion') ?: '2026.2.1'
        intellijIdea platformVersion

        // Headless platform test fixtures (BasePlatformTestCase), so completion /
        // rename can be driven end-to-end in `./gradlew test` without an IDE.
        testFramework org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE
    }
    testImplementation 'junit:junit:4.13.2'
}

// JUnit 3/4-style platform tests (BasePlatformTestCase extends UsefulTestCase).
test {
    useJUnit()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        // The inlay API is @ApiStatus.Experimental/ScheduledForRemoval in spots.
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '233'
            // No upper bound: the plugin uses stable platform APIs, so let it
            // load on current and future builds (the IDE only enforces this).
            untilBuild = provider { null }
        }
    }
}
