plugins {
    id 'java'
    // The classic Gradle IntelliJ Plugin (1.x) — battle-tested for Java plugins.
    id 'org.jetbrains.intellij' version '1.17.4'
}

group 'org.rosegold'
version '0.1.0'

repositories {
    mavenCentral()
}

// Target the IntelliJ Platform. IC = IDEA Community; any JetBrains IDE on this
// build works. JDK 17 is the toolchain for 2023.3+ (build with JDK 17 or newer).
intellij {
    version = '2023.3.8'
    type = 'IC'
    plugins = []
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

patchPluginXml {
    sinceBuild = '233'
    untilBuild = '243.*'
}

// Speeds up local builds; drop if you publish and want searchable settings.
buildSearchableOptions {
    enabled = false
}
