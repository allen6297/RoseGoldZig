org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false

# IntelliJ 2026.2 runs on JBR 25, so its platform jars are Java 25 class files and
# the plugin must be compiled with JDK 25. The IDE bundles a JBR 25 — point
# Gradle's toolchain detection at it so no separate JDK download is needed.
# (Missing paths are ignored; the foojay resolver in settings.gradle then
# auto-provisions a JDK 25 as a fallback.)
org.gradle.java.installations.paths=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

# Kotlin (inlay provider) targets 17 while the platform forces Java to 25;
# both run on JBR 25, so relax the strict same-target check.
kotlin.jvm.target.validation.mode=warning

# The IDE provides the Kotlin stdlib at runtime; do not bundle our own.
kotlin.stdlib.default.dependency=false
